version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - C:/Users/Cris-SX/.aws:/home/appuser/.aws:ro
    networks:
      - app_network

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    ports:
      - "6000:5432"
    environment:
      POSTGRES_USER: basevital
      POSTGRES_PASSWORD: basevital
      POSTGRES_DB: basevital
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/main/resources/sql/database-script/seed-develop-db.sql:/docker-entrypoint-initdb.d/seed-develop-db.sql
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
